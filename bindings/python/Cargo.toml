[package]
name = "memvid-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Python bindings for memvid via PyO3"
publish = false

[lib]
name = "memvid"
crate-type = ["cdylib"]

[dependencies]
memvid-core = { path = "../.." }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = "1"
serde_json = "1"

[features]
temporal_track = ["memvid-core/temporal_track"]
